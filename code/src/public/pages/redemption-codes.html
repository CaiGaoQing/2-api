<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兑换码管理 - Kiro Account Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <div class="page-title-section">
                        <div class="page-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/>
                                <path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/>
                                <path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"/>
                            </svg>
                        </div>
                        <div>
                            <h1 class="page-title">兑换码管理</h1>
                            <p class="page-subtitle">生成和管理 API 密钥兑换码</p>
                        </div>
                    </div>
                </div>
            </header>

            <div class="content-area" id="redemption-page">
                <!-- 统计卡片 -->
                <div class="stats-row" style="display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap;">
                    <div class="stat-card" style="flex: 1; min-width: 120px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 16px; text-align: center;">
                        <div style="font-size: 24px; font-weight: 700; color: var(--text-primary);" id="stat-total">0</div>
                        <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">总计</div>
                    </div>
                    <div class="stat-card" style="flex: 1; min-width: 120px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 16px; text-align: center;">
                        <div style="font-size: 24px; font-weight: 700; color: var(--accent-primary);" id="stat-unused">0</div>
                        <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">未使用</div>
                    </div>
                    <div class="stat-card" style="flex: 1; min-width: 120px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 16px; text-align: center;">
                        <div style="font-size: 24px; font-weight: 700; color: var(--accent-success);" id="stat-used">0</div>
                        <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">已使用</div>
                    </div>
                    <div class="stat-card" style="flex: 1; min-width: 120px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 16px; text-align: center;">
                        <div style="font-size: 24px; font-weight: 700; color: var(--accent-danger);" id="stat-expired">0</div>
                        <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">已过期</div>
                    </div>
                </div>

                <div class="content-header">
                    <div class="content-header-left">
                        <span class="account-count" id="codes-count">共 0 个兑换码</span>
                        <div class="sort-select-wrapper">
                            <select class="form-select sort-select" id="filter-status">
                                <option value="">全部状态</option>
                                <option value="unused">未使用</option>
                                <option value="used">已使用</option>
                                <option value="expired">已过期</option>
                                <option value="disabled">已禁用</option>
                            </select>
                        </div>
                    </div>
                    <div class="content-header-right">
                        <button class="btn btn-primary" id="generate-btn">
                            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"/>
                                <line x1="5" y1="12" x2="19" y2="12"/>
                            </svg>
                            生成兑换码
                        </button>
                    </div>
                </div>

                <div class="table-container" id="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 18%;">兑换码</th>
                                <th style="width: 12%;">套餐</th>
                                <th style="width: 8%;">状态</th>
                                <th style="width: 15%;">兑换信息</th>
                                <th style="width: 12%;">备注</th>
                                <th style="width: 12%;">创建时间</th>
                                <th style="width: 12%;">过期时间</th>
                                <th style="width: 11%;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="codes-tbody"></tbody>
                    </table>
                </div>

                <div class="empty-state" id="empty-state" style="display: none;">
                    <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    <h3 class="empty-title">暂无兑换码</h3>
                    <p class="empty-description">点击上方按钮生成您的第一批兑换码</p>
                    <button class="btn btn-primary" id="empty-generate-btn">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        生成兑换码
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- 生成兑换码弹窗 -->
    <div class="modal-overlay" id="generate-modal">
        <div class="modal" style="max-width: 480px;">
            <div class="modal-header">
                <h2 class="modal-title">生成兑换码</h2>
                <button class="modal-close" id="modal-close">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">关联套餐 *</label>
                    <select class="form-input" id="gen-package">
                        <option value="">请选择套餐</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">生成数量 *</label>
                    <input type="number" class="form-input" id="gen-count" value="1" min="1" max="100" placeholder="1-100">
                </div>
                <div class="form-group">
                    <label class="form-label">过期时间 (可选)</label>
                    <input type="datetime-local" class="form-input" id="gen-expires">
                </div>
                <div class="form-group">
                    <label class="form-label">备注 (可选)</label>
                    <input type="text" class="form-input" id="gen-note" placeholder="例如: 活动赠送">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modal-cancel">取消</button>
                <button class="btn btn-primary" id="modal-submit">生成</button>
            </div>
        </div>
    </div>

    <!-- 生成结果弹窗 -->
    <div class="modal-overlay" id="result-modal">
        <div class="modal" style="max-width: 520px;">
            <div class="modal-header">
                <h2 class="modal-title">生成成功</h2>
                <button class="modal-close" id="result-close">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div id="result-codes" style="background: var(--bg-tertiary); border-radius: var(--radius-md); padding: 16px; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 14px; line-height: 1.8;"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="result-copy">复制全部</button>
                <button class="btn btn-primary" id="result-ok">确定</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="/js/common.js"></script>
    <script src="/js/redemption-codes.js"></script>
</body>
</html>
