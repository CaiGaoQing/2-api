<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grok Token 管理 - All-2-API</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <div class="page-title-section">
                        <div class="page-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
                                <path d="M8 12l3 3 5-5"/>
                            </svg>
                        </div>
                        <div>
                            <h1 class="page-title">Grok Token 管理</h1>
                            <p class="page-subtitle">管理 Grok SSO Token 池（支持 grok-3/4/4.1 全系列模型）</p>
                        </div>
                    </div>
                </div>
                <div class="header-center">
                    <div class="search-box">
                        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="M21 21l-4.35-4.35"/>
                        </svg>
                        <input type="text" id="search-input" placeholder="搜索 Token...">
                    </div>
                </div>
                <div class="header-right">
                    <div class="header-tabs">
                        <button class="header-tab active" data-filter="all">全部 <span class="tab-count" id="tab-count-all">0</span></button>
                        <button class="header-tab" data-filter="active">活跃 <span class="tab-count" id="tab-count-active">0</span></button>
                        <button class="header-tab" data-filter="cooling">冷却 <span class="tab-count" id="tab-count-cooling">0</span></button>
                        <button class="header-tab" data-filter="expired">过期 <span class="tab-count" id="tab-count-expired">0</span></button>
                    </div>
                    <button class="btn btn-primary" id="add-token-btn">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        添加 Token
                    </button>
                    <button class="btn btn-secondary" id="batch-import-btn">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        批量导入
                    </button>
                </div>
            </header>

            <!-- Statistics Cards -->
            <div class="stats-cards" id="stats-cards">
                <div class="stat-card">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value" id="stat-total">0</div>
                        <div class="stat-label">总 Token</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon success">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                            <polyline points="22 4 12 14.01 9 11.01"/>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value" id="stat-active">0</div>
                        <div class="stat-label">活跃</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon warning">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="12"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value" id="stat-cooling">0</div>
                        <div class="stat-label">冷却中</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon error">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="15" y1="9" x2="9" y2="15"/>
                            <line x1="9" y1="9" x2="15" y2="15"/>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value" id="stat-expired">0</div>
                        <div class="stat-label">已过期</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon info">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value" id="stat-quota">0</div>
                        <div class="stat-label">总配额</div>
                    </div>
                </div>
            </div>

            <!-- Content Area -->
            <div class="content-area">
                <div class="content-header">
                    <div class="content-header-left">
                        <span class="account-count">共 <strong id="displayed-count">0</strong> 个 Token</span>
                    </div>
                    <div class="content-header-right">
                        <select id="pool-filter" class="form-select" style="width:auto;font-size:13px;padding:4px 8px;">
                            <option value="all">全部池</option>
                            <option value="ssoBasic">Basic 池</option>
                            <option value="ssoSuper">Super 池</option>
                        </select>
                    </div>
                </div>

                <!-- Table -->
                <div class="table-container">
                    <table class="data-table" id="token-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Token</th>
                                <th>池</th>
                                <th>状态</th>
                                <th>配额</th>
                                <th>使用次数</th>
                                <th>失败</th>
                                <th>最后使用</th>
                                <th>备注</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="token-tbody"></tbody>
                    </table>
                </div>

                <!-- Empty State -->
                <div class="empty-state" id="empty-state" style="display: none;">
                    <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
                        <path d="M8 12l3 3 5-5"/>
                    </svg>
                    <h3 class="empty-title">暂无 Grok Token</h3>
                    <p class="empty-description">点击上方"添加 Token"或"批量导入"开始添加 SSO Token</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Token Modal -->
    <div class="modal-overlay" id="add-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">添加 Grok Token</h2>
                <button class="modal-close" id="modal-close">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="add-token-form">
                    <div class="form-group">
                        <label class="form-label">SSO Token <span class="required">*</span></label>
                        <textarea class="form-textarea" id="input-token" placeholder="输入 SSO Token（不含 sso= 前缀）" required></textarea>
                        <p class="form-hint">从 Grok.com 的 Cookie 中获取的 sso token</p>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Token 池</label>
                        <select class="form-select" id="input-pool">
                            <option value="ssoBasic">ssoBasic（基础，配额 80）</option>
                            <option value="ssoSuper">ssoSuper（高级，配额 140）</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">备注</label>
                        <input type="text" class="form-input" id="input-note" placeholder="可选备注信息">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modal-cancel">取消</button>
                <button class="btn btn-primary" id="modal-submit">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    添加 Token
                </button>
            </div>
        </div>
    </div>

    <!-- Batch Import Modal -->
    <div class="modal-overlay" id="batch-import-modal">
        <div class="modal" style="max-width: 640px;">
            <div class="modal-header">
                <h2 class="modal-title">批量导入 Grok Token</h2>
                <button class="modal-close" id="batch-modal-close">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Token 列表 <span class="required">*</span></label>
                    <textarea class="form-textarea" id="batch-tokens" style="min-height: 200px; font-family: monospace; font-size: 12px;" placeholder="每行一个 SSO Token，支持 sso= 前缀（会自动去除）"></textarea>
                    <p class="form-hint">每行一个 Token</p>
                </div>
                <div class="form-group">
                    <label class="form-label">导入到池</label>
                    <select class="form-select" id="batch-pool">
                        <option value="ssoBasic">ssoBasic（基础，配额 80）</option>
                        <option value="ssoSuper">ssoSuper（高级，配额 140）</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="batch-modal-cancel">取消</button>
                <button class="btn btn-primary" id="batch-modal-submit">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    导入
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="/js/common.js"></script>
    <script src="/js/grok.js"></script>
</body>
</html>
